name: Release APK (AOSP release key)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (defaults to v<pubspec version>)"
        required: false
        type: string
      include_x64:
        description: "Also build x64 APK (defaults to false for faster builds)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  GRADLE_VERSION: 9.3.1

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Configure Flutter & Android SDK
        working-directory: app
        run: |
          flutter pub get
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" "$FLUTTER_ROOT" > android/local.properties

      - name: Prepare AOSP release/testkey keystore
        run: |
          set -euo pipefail
          pem="$RUNNER_TEMP/testkey.x509.pem"
          pk8="$RUNNER_TEMP/testkey.pk8"
          fetch_aosp() {
            local file="$1" out="$2"
            if curl -fsSL "https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/${file}?format=TEXT" \
              | base64 -d > "$out" 2>/dev/null && [[ -s "$out" ]]; then
              return 0
            fi
            curl -fsSL "https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/${file}" -o "$out"
          }
          fetch_aosp testkey.x509.pem "$pem"
          fetch_aosp testkey.pk8 "$pk8"

          fp="$(openssl x509 -in "$pem" -noout -fingerprint -sha256 | sed 's/.*=//; s/://g' | tr '[:upper:]' '[:lower:]')"
          expected_fp="a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc"
          if [[ "$fp" != "$expected_fp" ]]; then
            echo "Unexpected AOSP testkey SHA-256 fingerprint: $fp (expected $expected_fp)" >&2
            exit 1
          fi

          key_pem="$RUNNER_TEMP/testkey.key.pem"
          p12="$RUNNER_TEMP/aosp-testkey.p12"
          jks="$RUNNER_TEMP/aosp-testkey.jks"
          openssl pkcs8 -inform DER -nocrypt -in "$pk8" -out "$key_pem"
          openssl pkcs12 -export \
            -in "$pem" \
            -inkey "$key_pem" \
            -name testkey \
            -out "$p12" \
            -passout pass:android
          keytool -importkeystore -noprompt \
            -srckeystore "$p12" -srcstoretype PKCS12 -srcstorepass android \
            -destkeystore "$jks" -deststoretype JKS -deststorepass android -destkeypass android

          printf 'storeFile=%s\nstorePassword=android\nkeyAlias=testkey\nkeyPassword=android\n' "$jks" > app/android/key.properties

      - name: Compute shell-tools cache key
        id: shell-hash
        run: echo "hash=$(sha256sum tooling/build-shell-tools.sh | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore cached shell-tools via actions/cache
        id: cache-shell
        uses: actions/cache@v4
        with:
          path: app/android/app/src/main/jniLibs
          key: shell-tools-${{ steps.shell-hash.outputs.hash }}

      - name: Restore prebuilt shell-tools from workflow artifacts
        id: restore-shell
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL_HASH: ${{ steps.shell-hash.outputs.hash }}
          CACHE_HIT: ${{ steps.cache-shell.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" == "true" ]] && bash tooling/build-shell-tools.sh --verify-only; then
            echo "restored=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          art_id="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=shell-tools-${TOOL_HASH}&per_page=10" --jq '[.artifacts[] | select(.expired == false)][0].id // empty' || true)"
          if [[ -n "$art_id" ]]; then
            echo "Found prebuilt shell-tools-${TOOL_HASH} artifact ($art_id), downloading..."
            mkdir -p app/android/app/src/main/jniLibs
            if gh api "repos/${{ github.repository }}/actions/artifacts/${art_id}/zip" > "$RUNNER_TEMP/shell-tools.zip" \
              && unzip -q -o "$RUNNER_TEMP/shell-tools.zip" -d app/android/app/src/main/jniLibs \
              && chmod 0755 app/android/app/src/main/jniLibs/*/*.so \
              && bash tooling/build-shell-tools.sh --verify-only; then
              rm -f "$RUNNER_TEMP/shell-tools.zip"
              echo "restored=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            rm -f "$RUNNER_TEMP/shell-tools.zip"
          fi
          echo "restored=false" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for multi-arch shell binaries
        if: steps.restore-shell.outputs.restored != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Build bundled bash and busybox native binaries
        if: steps.restore-shell.outputs.restored != 'true'
        run: bash tooling/build-shell-tools.sh

      - name: Cache prebuilt shell-tools workflow artifact
        if: steps.restore-shell.outputs.restored != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shell-tools-${{ steps.shell-hash.outputs.hash }}
          path: app/android/app/src/main/jniLibs
          if-no-files-found: error
          retention-days: 90

      - name: Build signed release APKs
        run: |
          flavor="arm64"
          if [[ "${{ inputs.include_x64 }}" == "true" ]]; then
            flavor="all"
          fi
          echo "Building release APK flavor: $flavor"
          bash tooling/build-apk.sh -f "$flavor" --release

      - name: Clean temporary signing files
        if: always()
        run: rm -f app/android/key.properties "$RUNNER_TEMP"/testkey.* "$RUNNER_TEMP"/aosp-testkey.*

      - name: Verify release APK signatures and package assets
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner="$(ls -1d "$sdk"/build-tools/*/apksigner | sort -V | tail -n 1)"
          found_apk=false
          for apk in app/build/app/outputs/flutter-apk/app-*-release.apk; do
            [[ -f "$apk" ]] || continue
            found_apk=true
            echo "Verifying signature of $apk..."
            "$apksigner" verify -v --min-sdk-version 26 --print-certs "$apk"
            "$apksigner" verify --print-certs "$apk" | grep -qi "a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc"
          done
          if [[ "$found_apk" != "true" ]]; then
            echo "Error: No release APK found in app/build/app/outputs/flutter-apk!" >&2
            exit 1
          fi
          python3 tooling/release_assets.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-go-release-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version="$(python3 -c 'import re; print(re.search(r"^version:\s*([^+\s]+)", open("app/pubspec.yaml").read(), re.M).group(1))')"
          tag="${INPUT_TAG:-${GITHUB_REF_NAME:-v$version}}"
          if [[ "$tag" == "main" || -z "$tag" ]]; then
            tag="v$version"
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/antigravity-go-*.apk dist/SHA256SUMS dist/update.json dist/version.json --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file dist/RELEASE_NOTES.md
          else
            gh release create "$tag" dist/antigravity-go-*.apk dist/SHA256SUMS dist/update.json dist/version.json \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Antigravity Go $version (AOSP release key)" \
              --notes-file dist/RELEASE_NOTES.md
          fi
